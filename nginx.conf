server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Only used under docker compose, where a "backend" host exists on the
  # shared network. Resolving it through a variable defers the DNS lookup to
  # request time, so nginx still boots where that host doesn't exist at all
  # (e.g. a Railway deploy, which bakes the API's public URL into the build
  # instead and never hits this rule).
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://backend:3001;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
