server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Only reachable when a "backend" host exists on the same Docker network
  # (i.e. under docker compose). A Railway deploy bakes the API's public
  # URL into the frontend build instead, so this rule just goes unused there.
  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
